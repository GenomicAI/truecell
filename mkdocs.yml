site_name: truecell
site_description: A Python port of Seurat's single-cell pipeline, verified against R Seurat test by test
site_url: https://genomicai.github.io/truecell/
repo_url: https://github.com/GenomicAI/truecell
repo_name: GenomicAI/truecell
edit_uri: edit/main/docs/
copyright: MIT-licensed. Seurat is a trademark of its own authors; truecell is an independent port.

# The vignettes and their figures live in `tutorials/`, next to the scripts that
# produce them, and `docs/tutorials` is a symlink there. That keeps one copy of
# each vignette — the one a reader of the repo finds — instead of a docs copy
# that drifts from it. It is also why the exclusions below exist: the symlink
# brings the whole tutorial working directory with it, intermediates included.
docs_dir: docs
site_dir: site

# `mkdocs serve` watches docs_dir and the config; the API pages are generated
# from the package, so it has to be told about the source too — otherwise a
# docstring edit shows no change until the server is restarted.
watch:
  - truecell
  - tools

exclude_docs: |
  # Regenerable handoff data between the Python and R sides of each tutorial —
  # megabytes of CSV that nothing on the site links to. The `.py` and `.R`
  # sources are deliberately *not* excluded: several vignettes link to them,
  # and a reader following "the script that produced this" should land on it.
  tutorials/figures*/*.csv
  tutorials/figures*/*.json
  tutorials/figures*/*.txt
  tutorials/figures*/*.npy
  tutorials/figures*/*_store*/
  tutorials/figures*/*.lazy/
  tutorials/**/__pycache__/
  # The benchmark harness's raw measurements and its per-child stdout — the data
  # behind PERFORMANCE.md, which quotes what matters. Nothing on the site links
  # to the JSON, and there are two full sweeps of it.
  tutorials/benchmark/results*/
  tutorials/benchmark/logs/
  # Written by make_report.py into the working tree; gitignored, so it is only
  # ever present for someone who has just run a sweep — and their `mkdocs build`
  # should not start failing because of it.
  tutorials/benchmark/tables.md
  # Usage notes for the logo files, addressed to someone browsing the repo
  # rather than the site. It links to `tools/make_logo.py`, which is outside
  # docs_dir, so building it would mean either a broken link here or a link
  # that is wrong on GitHub. The assets themselves are still published.
  assets/logo/README.md

not_in_nav: |
  tutorials/*.py
  tutorials/*.R
  # Addressed to someone running the benchmarks from a checkout, not reading
  # the site. PERFORMANCE.md, which is the output, *is* in the nav.
  tutorials/benchmark/README.md

validation:
  # A nav entry pointing at a file that no longer exists, or a heading link that
  # no longer resolves, is exactly the kind of rot this site is meant not to
  # have. Both are errors, and CI builds with --strict.
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  language: en
  # The header is the primary colour in both palettes -- pine in light, a
  # darker pine in slate -- so the header logo is always sitting on a dark
  # ground, and it is the cream-ink file that goes there in both. It is the
  # simplified glyph rather than the pointillist mark because the header renders
  # it at about 24px, well under the 48px the dots need to hold together.
  logo: assets/logo/truecell-glyph-open.svg
  favicon: assets/logo/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # GitHub's heading slugs, not python-markdown's. The vignettes are read on
      # GitHub as well as here and link to each other's headings, and the two
      # sluggers disagree wherever a heading contains an em dash or a middle dot
      # — `## Step 12 · UMAP` is `step-12--umap` there and `step-12-umap` here.
      # Matching GitHub keeps one set of links correct in both places; the
      # alternative was rewriting anchors in the vignettes and breaking them on
      # the repo page instead.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.smartsymbols

hooks:
  # The vignettes put the R and the Python figure side by side in raw HTML
  # tables, and MkDocs only rewrites relative paths written in Markdown syntax.
  # This re-anchors the raw `<img src>` ones the same way, so one path in the
  # source renders correctly both here and on GitHub.
  - tools/mkdocs_html_relpaths.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            extensions:
              # The docstrings use Sphinx roles. Translated to autorefs links
              # here rather than rewritten across 129 source sites.
              - tools/griffe_sphinx_roles.py:SphinxRolesExtension
            # The package documents itself in NumPy style — 54 `Parameters
            # ----------` blocks and no Google-style `Args:` anywhere.
            docstring_style: numpy
            # `table` squeezes annotations like `Optional[Union[list[int],
            # range]]` into a narrow Type column where they wrap mid-bracket.
            # The separate signature above already carries every annotation, so
            # the parameter list only has to carry prose.
            docstring_section_style: list
            # Signatures rendered separately, with annotations, and every type
            # linked where it resolves. `matplotlib.figure.Figure`,
            # `Neighbor` and `Truecell` are all annotation-only imports guarded by
            # `if TYPE_CHECKING:`; griffe reads them statically, so they render
            # here even though `typing.get_type_hints()` cannot resolve them at
            # runtime. See docs/fidelity.md.
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 88
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 2
            filters: ["!^_"]
            merge_init_into_class: true
            inherited_members: false
            annotations_path: brief

nav:
  - Home:
      - index.md
      - installation.md
      - quickstart.md
      - interop.md
      - fidelity.md
  - Tutorials:
      - tutorials/README.md
      - Foundations:
          - tutorials/pbmc3k_tutorial.md
          - tutorials/advanced_pbmc8k_subclustering.md
          - tutorials/objects_vignette.md
      - Normalization and DE:
          - tutorials/sctransform_vignette.md
          - tutorials/de_vignette.md
          - tutorials/dimreduc_vignette.md
          - tutorials/cellcycle_vignette.md
      - Integration and mapping:
          - tutorials/integration_vignette.md
          - tutorials/anchors_vignette.md
          - tutorials/refmap_vignette.md
      - Multimodal and screens:
          - tutorials/multimodal_citeseq.md
          - tutorials/hashing_vignette.md
          - tutorials/mixscape_vignette.md
      - Spatial:
          - tutorials/xenium_spatial_tutorial.md
          - tutorials/svf_vignette.md
          - tutorials/visium_vignette.md
      - Scale:
          - tutorials/sketch_vignette.md
          - tutorials/lazy_vignette.md
      - Performance:
          - tutorials/benchmark/PERFORMANCE.md
  - API reference:
      - api/index.md
      - api/objects.md
      - api/preprocessing.md
      - api/dimreduc.md
      - api/clustering.md
      - api/markers.md
      - api/integration.md
      - api/scoring.md
      - api/demux.md
      - api/spatial.md
      - api/scale.md
      - api/plotting.md
      - api/generics.md
      - api/io.md
  - Project:
      - CHANGELOG.md
      - ROADMAP.md
