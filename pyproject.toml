[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truecell"
version = "1.2.0"
description = "Python single-cell genomics toolkit — a port of Seurat's core data structures and analysis pipeline"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Shanika Amarasoma", email = "shanika.amarasoma@gmail.com" },
]
keywords = ["single-cell", "RNA-seq", "bioinformatics", "scRNA-seq", "genomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Tracks SPEC 0, the support window the scientific stack itself follows: three
# years past a Python release. That put 3.10 out in Oct 2024 and 3.11 in Oct
# 2025 — both already past — while upstream EOL alone would have kept 3.11 until
# Oct 2027. numpy/scipy/pandas/scikit-learn are the versions that actually
# constrain us, so their calendar is the one worth tracking, not CPython's.
#
# Published releases stay installable on the versions they declared: a 3.11 user
# resolves to 0.2.0, the last release with `>=3.10`. Nothing breaks retroactively.
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
analysis = [
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "numba>=0.59",
    "umap-learn>=0.5",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-misc>=0.3",
]
anndata = ["anndata>=0.10"]
integration = ["harmonypy>=0.0.9"]
deseq2 = ["pydeseq2>=0.5.4,<0.6"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
    # load_xenium prefers cells.parquet when pandas can read it, and
    # tests/test_loaders_vs_seurat.py checks that path against LoadXenium.
    # Without an engine in the test environment that path would never run.
    "pyarrow>=16",
]
# The documentation site. In `all` on purpose: tests/test_docs.py builds the
# site with --strict, which is the only check that catches a broken
# cross-reference or a stale heading anchor, and it can only run if the
# toolchain is present in the same environment CI tests in.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
all = ["truecell[analysis,anndata,integration,deseq2,dev,docs]"]

[project.urls]
Homepage = "https://github.com/GenomicAI/truecell"
Repository = "https://github.com/GenomicAI/truecell"
"Bug Tracker" = "https://github.com/GenomicAI/truecell/issues"

[tool.hatch.build.targets.wheel]
packages = ["truecell"]

# Without this the sdist is whatever happens to be sitting in the working tree.
# `docs/tutorials` is a symlink to `tutorials/`, hatchling follows it, and the
# tutorials write their intermediates *into* the directory they live in — the
# BPCells stores, the `.lazy` matrices, the R handoff CSVs. Those are all in
# `.gitignore`, but an sdist is not built from git, so they were being shipped.
# The published `shanuz` 0.9.0 sdist is 23.5 MB against a 0.24 MB wheel for that
# reason, and building it on a machine that had just run the tutorials produced
# 63 MB — the same version number, a different tarball, depending on the disk it
# was built from.
#
# So the sdist is listed explicitly rather than filtered: it carries what you
# need to build and test the package from source. The documentation and the
# tutorials are a repository and a website, not a payload every installer pays
# to download.
[tool.hatch.build.targets.sdist]
include = [
  "truecell/",
  "tests/",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "ROADMAP.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Tests and tutorials are runnable straight from a clone, so each one bootstraps
# `sys.path` before importing truecell. That puts every subsequent import below a
# statement, which is E402 by definition — 121 reports for one deliberate line
# per file. Ignored by scope rather than by 121 scattered `# noqa: E402`.
"tests/*" = ["E402"]
"tutorials/*" = ["E402"]

[tool.mypy]
# Deliberately no `python_version`. Pinning it to our floor also makes mypy parse
# every *followed* import at that version, third-party source included — and
# `anndata>=0.10` resolves to 0.13.2, which uses PEP 695 `def _reduce[T](...)`
# syntax. Under a pre-3.12 setting mypy aborts the whole run with "errors
# prevented further checking" and silently checks nothing, while `|| true` keeps
# CI green. The floor is 3.12 now, so that particular trap is behind us, but the
# shape of it is not: each leg targets its own interpreter instead, and the
# lowest leg is what proves the package still supports the floor it declares.
#
# Scope is pinned here rather than only in CI's command, so a bare `mypy` checks
# exactly what CI checks. `ruff` takes its scope from the command line, where
# `ruff check truecell` (75 errors) and `ruff check .` (163) are both correct and
# easy to confuse.
files = ["truecell"]
# The scientific stack (scipy, sklearn, numba, umap-learn, igraph, anndata, ...)
# ships no type information. Without this, ~140 errors saying only "this third
# party has no stubs" drown the ~80 that are about our own code.
ignore_missing_imports = true
