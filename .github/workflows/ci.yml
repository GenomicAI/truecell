name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The `freshdeps` job below is the one that needs a clock. Everything else
  # installs from `uv.lock` and only changes when someone changes it.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor `requires-python` declares; the bottom leg is the
        # only thing that proves that floor still works.
        #
        # 3.14 is deliberately absent despite being released and otherwise
        # working: `harmonypy` publishes manylinux wheels for cp39-cp313 only,
        # so a 3.14 leg falls back to building it from source, which needs BLAS
        # and a CMake-fetched armadillo that ubuntu-latest does not have.
        # Letting the resolver avoid that is worse — it backtracks to harmonypy
        # 0.2.0, which depends on torch and drags in the whole CUDA stack.
        # Everything else in the dependency set already has cp314 wheels. Add
        # the leg once harmonypy ships one; see ROADMAP.md.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, not just the tip. tests/test_packaging.py cross-checks the
          # release tags against CHANGELOG.md, and the default depth-1 clone
          # fetches no tags at all — so that test skipped silently here, inert in
          # the one place it should catch a tag nobody wrote an entry for.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install
        # From `uv.lock`, not resolved fresh. The tutorial figures are committed
        # to the repository and their generators run in a developer's own
        # environment, so "what CI tested" and "what drew that PNG" have to be
        # the same set of versions or the figures drift for reasons no number
        # reports. UMAP is the clear case: the layout moved visibly across an
        # umap-learn/sklearn/numpy step while every anchor the tutorial checks
        # stayed identical, because clustering runs off the SNN graph and the
        # embedding is only ever displayed.
        #
        # `--locked` fails rather than silently re-resolving when `uv.lock` has
        # fallen behind `pyproject.toml`, which is the failure this is for: a
        # dependency edit that never made it into the lock would otherwise be
        # tested here and missing everywhere else.
        run: uv sync --all-extras --locked --python ${{ matrix.python-version }}

      - name: Lint (ruff, advisory)
        # Pre-existing lint debt in older modules is not yet cleared, so the
        # full check is informational; it must not gate the build.
        run: uv run ruff check truecell || true

      - name: Type check (mypy, advisory)
        # Same footing as ruff, and for the same reason: ~80 pre-existing errors
        # across 15 modules, several hundred more under --strict. Clean is a
        # v0.10.0 goal, not today's state, so this reports without gating. Scope
        # and settings come from [tool.mypy] in pyproject.toml, so this bare
        # `mypy` and a developer's bare `mypy` check the same file set.
        #
        # The count no longer drifts per leg: both legs install the same pinned
        # versions from `uv.lock`, so ruff's and mypy's own versions are pinned
        # too and the number only moves when someone moves it. It is a figure
        # worth reading now rather than a scale — but clearing it is still a
        # separate change, so this stays advisory.
        run: uv run mypy || true

      - name: Run tests
        run: uv run pytest tests/ -q --cov=truecell --cov-report=term --cov-report=xml

      - name: Upload coverage
        # One matrix leg is enough; the other two would upload the same numbers.
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  tutorials:
    name: Run the PBMC 3k tutorials against real data
    # The `test` job runs 1,179 unit tests and cannot see any of this. The
    # tutorials are scripts run end to end against a real dataset, gated behind
    # `TRUECELL_TUTORIAL_SMOKE=1` because most of them need ~200 MB of cached
    # data — so until now nothing here ran in CI at all.
    #
    # That gap shipped a defect. `test_cell_type_map_matches_the_markers` was
    # written to stop the pbmc3k figure labels drifting, was correct, and never
    # executed: when the cluster count went 9 -> 8 the hardcoded label map kept
    # nine entries, and the whole of 1.0.0 went out with the 14-cell platelet
    # cluster captioned "DC" in the tutorial's headline UMAP. It was found by
    # running the suite by hand before cutting 1.1.0. Twice now a labelled
    # figure has been published wrong, and both times the guard existed.
    #
    # PBMC 3k alone, because it is 28 MB against the full set's ~200 MB and it
    # is where the labelled figures come from. The other datasets stay
    # developer-run; this is the slice that pays for itself.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install
        run: uv sync --all-extras --locked --python 3.12

      - name: Cache the PBMC 3k dataset
        uses: actions/cache@v4
        with:
          path: ~/.truecell_data/pbmc3k
          # Static key on purpose. The obvious alternative, hashing
          # `truecell/datasets.py`, throws the cache away on every unrelated
          # edit to that module — it holds every other downloader too. **Bump
          # the suffix by hand if `_PBMC3K_URLS` changes**, since nothing else
          # will notice that the bytes behind the key are different.
          key: truecell-data-pbmc3k-v1

      - name: Fetch the dataset if the cache missed
        # Idempotent: `pbmc3k()` downloads only when matrix.mtx is absent, so on
        # a cache hit this is a load and a discard. Kept as its own step so a
        # 10x Genomics outage reads as "the download failed" rather than as a
        # tutorial failure thirty lines into a pytest log.
        run: uv run python -c "from truecell.datasets import pbmc3k; pbmc3k()"

      - name: Verify the dataset is actually there
        # Without this, a fetch that half-succeeded leaves every test to skip
        # itself on `dataset not cached` and the job is green having run
        # nothing — which is the exact failure this job exists to end.
        run: test -f ~/.truecell_data/pbmc3k/filtered_gene_bc_matrices/hg19/matrix.mtx

      - name: Run the PBMC 3k tutorials end to end
        shell: bash
        env:
          TRUECELL_TUTORIAL_SMOKE: "1"
        run: |
          set -o pipefail
          # Deselecting the datasets we do *not* cache, rather than selecting
          # the ones we do. An allow-list (`-k "pbmc3k or cell_type"`) reads
          # more naturally and is the wrong choice: a pbmc3k test added later
          # under any other name would quietly never run here, which is the
          # shape of the defect this job exists to prevent. Inverted, a new
          # pbmc3k test is picked up automatically, and a new test needing an
          # uncached dataset turns this job red until someone adds it below —
          # loud, and the right way round.
          #
          # `lazy_bpcells` and `de_tutorial` are excluded for a **different
          # reason, and it is a weaker one**: both pass here, and their data is
          # already cached. They were 65% of the runtime (136s and 102s of 364s
          # locally; the first CI run took 16m33s for the eleven), and neither
          # produces a labelled figure, which is the drift this job exists to
          # catch. So they are a cost trim, not a coverage judgement — the code
          # they exercise is real and no unit test covers it the same way, and
          # out-of-core has a history here (see ROADMAP's T-lazy entry). They
          # run in the full opt-in suite, which is a pre-release requirement
          # precisely because this job is not the whole story. If this job ever
          # gets a faster runner, put them back first.
          uv run pytest tests/test_tutorial_smoke.py -q \
            -k "not cbmc and not pbmc8k and not hashing and not thp1 \
                and not ifnb and not panc8 and not xenium and not visium \
                and not lazy_bpcells and not de_tutorial" \
            | tee smoke.log
          # A skip is a failure *here*. Every test this selects needs only the
          # dataset above, so the only ways to skip are a broken cache, a
          # misspelt opt-in variable, or a new test wanting a dataset this job
          # does not fetch — and all three produce a green tick for a job that
          # checked nothing. Exit 5 (pytest collected nothing) already fails
          # the step on its own.
          if grep -qE "[0-9]+ skipped" smoke.log; then
            echo "::error::a smoke test skipped — the dataset cache or the" \
                 "TRUECELL_TUTORIAL_SMOKE gate is not working, so this job" \
                 "verified nothing"
            exit 1
          fi

  wheel-tutorials:
    name: Run the PBMC 3k tutorials against the built wheel
    # A reviewer installs a release and runs the tutorials from a checkout, so the
    # scripts have to work against truecell from site-packages. Every other job
    # here has the checkout on sys.path, because `uv sync` installs the project
    # editable. That is how `pbmc3k_de_tutorial.py` shipped importing
    # `tutorials.bands` without putting the checkout root on sys.path: fine in an
    # editable install, `ModuleNotFoundError` against the 1.2.0 wheel.
    # `tests/test_tutorial_bootstrap.py` reads every tutorial for that; this job
    # runs two of them the way a reviewer would.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel into a fresh venv, at the lock's versions
        # Constrained by `uv.lock`, so a failure here is the wheel's and not a
        # new upstream release's; `freshdeps` is the job for those.
        run: |
          uv export --frozen --all-extras --no-emit-project --no-hashes \
            --format requirements-txt > "$RUNNER_TEMP/constraints.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" \
            -c "$RUNNER_TEMP/constraints.txt" "$(ls dist/truecell-*.whl)[analysis,deseq2]"

      - name: Copy the tutorials out of the checkout
        # Without the `truecell/` source tree beside them, so only the installed
        # wheel can answer `import truecell`.
        run: |
          mkdir "$RUNNER_TEMP/run"
          git archive HEAD tutorials | tar -x -C "$RUNNER_TEMP/run"
          test ! -e "$RUNNER_TEMP/run/truecell"

      - name: Cache the PBMC 3k dataset
        uses: actions/cache@v4
        with:
          path: ~/.truecell_data/pbmc3k
          # The `tutorials` job's key. Bump both together.
          key: truecell-data-pbmc3k-v1

      - name: Fetch the dataset if the cache missed
        working-directory: ${{ runner.temp }}/run
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "from truecell.datasets import pbmc3k; pbmc3k()"
          test -f ~/.truecell_data/pbmc3k/filtered_gene_bc_matrices/hg19/matrix.mtx

      - name: Check that truecell is the installed wheel
        working-directory: ${{ runner.temp }}/run
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c '
          import sysconfig, truecell
          site = sysconfig.get_paths()["purelib"]
          assert truecell.__file__.startswith(site), truecell.__file__
          print("truecell", truecell.__version__, "from", truecell.__file__)
          '

      - name: Run pbmc3k_tutorial.py
        working-directory: ${{ runner.temp }}/run
        run: '"$RUNNER_TEMP/venv/bin/python" tutorials/pbmc3k_tutorial.py'

      - name: Run pbmc3k_de_tutorial.py
        working-directory: ${{ runner.temp }}/run
        run: '"$RUNNER_TEMP/venv/bin/python" tutorials/pbmc3k_de_tutorial.py'

  freshdeps:
    # The interpolation is load-bearing: an explicit `name:` overrides the
    # default matrix suffix, so without it both legs would report under one
    # identical name and a single red leg would be unattributable.
    name: Resolve dependencies fresh (upstream canary, ${{ matrix.python-version }})
    # Pinning the test matrix to `uv.lock` buys reproducibility and gives up the
    # thing the old unpinned install did for free: noticing that a new release
    # of numpy, pandas or scikit-learn has broken us. `pyproject.toml` declares
    # `>=` floors, so that is what a user installing today actually gets.
    #
    # This job is that check, moved somewhere it belongs. It resolves fresh,
    # ignoring the lock, and it *fails* rather than reporting quietly — a
    # `|| true` here would be a green tick for a check that had stopped
    # checking. It runs weekly and on demand instead of on every pull request,
    # so upstream breaking is never mistaken for the pull request breaking.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      # Both legs, for the same reason the `test` matrix has both: an upstream
      # release can break one interpreter and not the other, and a canary that
      # only resolves under 3.12 stays green through it. `fail-fast: false`
      # because which legs broke is the diagnosis — one leg red localises the
      # breakage to that interpreter, both red points at the package itself.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install with the lock ignored
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[all]"

      - name: Show what resolved
        run: uv pip list

      - name: Run tests against the newest dependencies
        run: uv run --no-sync pytest tests/ -q

  build:
    name: Build and verify the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Check the metadata PyPI will render
        run: uvx twine check dist/*

      - name: Install the wheel clean and verify it imports
        # Two things this catches that the test job cannot. First, the test job
        # installs `-e .[all]`, so it never proves the *wheel* is complete or
        # that a plain `pip install truecell` works without the optional
        # scientific stack — the base deps are numpy/scipy/pandas/packaging and
        # everything heavier is imported lazily. Second, `__version__` now comes
        # from importlib.metadata, so it can only be verified against a real
        # (non-editable) install, where the dist-info is freshly written.
        #
        # `cd /tmp` matters: from the checkout root, `import truecell` would find
        # the source tree on sys.path and prove nothing about the wheel.
        run: |
          EXPECTED=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          uv venv --python 3.12 /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          cd /tmp
          EXPECTED="$EXPECTED" /tmp/wheel-venv/bin/python -c '
          import os, truecell
          expected = os.environ["EXPECTED"]
          assert truecell.__version__ == expected, (
              f"wheel reports {truecell.__version__!r}, pyproject declares {expected!r}"
          )
          print("wheel OK:", truecell.__version__, "from", truecell.__file__)
          '

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
